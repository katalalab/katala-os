# repo-standardize が置いた標準の安全チェック。PR で「新しく入った分」だけを止める。
# 既存の指摘で赤くならないよう、gitleaks は PR のコミット範囲、Semgrep は base との差分だけを見る。
name: security
on:
  pull_request:
permissions:
  contents: read
jobs:
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b # 1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 検査の設定と除外は base 側のものを使う(PR で自分の指摘を消せないように)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [ -n "$BASE_SHA" ] || exit 0
          for f in .gitleaks.toml .gitleaksignore .semgrepignore; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then git show "$BASE_SHA:$f" > "$f"; else rm -f "$f"; fi
          done
      - name: Semgrep CE (base との差分で新しく入った指摘だけ)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan --config p/default --metrics=off --error ${BASE_SHA:+--baseline-commit "$BASE_SHA"}
