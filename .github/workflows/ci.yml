name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify (hash-lock + skills)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify manifest and skills
        run: ./scripts/verify.sh

  no-instance-data:
    name: no instance data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # This repository publishes the shape of an operating discipline, never one
      # instance of it. Real hostnames, addresses, home paths, or credentials
      # reaching main would be unrecoverable once cloned, so the gate runs in CI
      # rather than relying on review attention.
      - name: Reject real hostnames, addresses, home paths and secrets
        run: ./scripts/check-no-instance-data.sh
      - name: Gate self-test (both-direction canaries)
        run: ./scripts/test-check-no-instance-data.sh

  # The gate is regexes handed to whatever engine the platform ships, and the
  # platforms disagree: \b matched nothing under BSD git grep while staying green
  # on Linux, so every macOS run of the gate reported clean regardless of the tree.
  # Only a macOS leg sees that class. Kept a separate job rather than a matrix leg
  # on the one above, because branch protection requires the context name
  # "no instance data" verbatim and a matrix would rename it out of existence.
  no-instance-data-macos:
    name: no instance data (macos)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reject real hostnames, addresses, home paths and secrets
        run: ./scripts/check-no-instance-data.sh
      - name: Gate self-test (both-direction canaries)
        run: ./scripts/test-check-no-instance-data.sh

  tests:
    name: tests (hooks + orchestration + gates)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Safety-valve behavior test
        run: bash hooks/test-safety-valve.sh
      - name: Orchestration dispatch tests
        run: |
          for t in orchestration/tests/test-*.sh; do
            echo "== $t"
            bash "$t"
          done
      - name: Python gate tests
        run: |
          python3 codex-ops/scripts/test-fleet-known-hosts-gate.py
          python3 codex-ops/scripts/test-tailscaled-log-size-gate.py

  # The known-hosts gate broke on Windows once (selectors cannot poll pipes
  # there) while staying green on Linux, so the Python tests get a Windows leg.
  tests-windows:
    name: tests (windows python)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Python gate tests
        shell: bash
        run: |
          python codex-ops/scripts/test-fleet-known-hosts-gate.py
          python codex-ops/scripts/test-tailscaled-log-size-gate.py
