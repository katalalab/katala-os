name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: [self-hosted, linux]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify manifest
        run: ./scripts/verify.sh
